 <text x="210" y="90" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#071a2f">Prueba de aptitud</text>
 <text x="210" y="150" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600" fill="#4a6173">Todos los solicitantes deben</text>
