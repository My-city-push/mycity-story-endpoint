<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="910" cy="210" r="250" fill="#19c3a5" opacity="0.12"/>
  <circle cx="120" cy="1650" r="300" fill="#ffb84d" opacity="0.10"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="122" fill="#9bd8cf" font-size="34" font-weight="700" letter-spacing="3">MYCITY • MOVILIDAD</text>
    <text x="88" y="245" fill="#ffffff" font-size="92" font-weight="800">Festival sin</text>
    <text x="88" y="345" fill="#ffffff" font-size="92" font-weight="800">tanta vuelta</text>
    <text x="90" y="410" fill="#c9d6df" font-size="35">Una opción práctica para llegar a Louder Than Life.</text>

    <g transform="translate(88 510)" filter="url(#shadow)">
      <rect x="0" y="0" width="904" height="280" rx="38" fill="#ffffff"/>
      <rect x="34" y="34" width="180" height="180" rx="28" fill="#0d2538"/>
      <text x="124" y="158" text-anchor="middle" fill="#ffffff" font-size="100" font-weight="800">P</text>
      <text x="252" y="95" fill="#112234" font-size="37" font-weight="800">PARQUEA DOWNTOWN</text>
      <text x="252" y="150" fill="#405568" font-size="34">115 W. Jefferson St.</text>
      <text x="252" y="211" fill="#112234" font-size="58" font-weight="800">$20 por vehículo</text>
      <text x="252" y="251" fill="#405568" font-size="28">Incluye ida y vuelta en TARC para todos dentro del auto.</text>
    </g>

    <g transform="translate(88 845)">
      <path d="M70 35 V560" stroke="#19c3a5" stroke-width="12" stroke-linecap="round"/>
      <circle cx="70" cy="58" r="28" fill="#19c3a5"/>
      <circle cx="70" cy="285" r="28" fill="#19c3a5"/>
      <circle cx="70" cy="538" r="28" fill="#19c3a5"/>

      <text x="130" y="58" fill="#ffffff" font-size="44" font-weight="800">1st &amp; Liberty</text>
      <text x="130" y="105" fill="#b9c8d3" font-size="32">Toma la Ruta 4 desde las 10 a.m.</text>
      <text x="130" y="150" fill="#b9c8d3" font-size="32">Salidas aprox. cada 15 min hasta las 7 p.m.</text>

      <text x="130" y="285" fill="#ffffff" font-size="44" font-weight="800">Kentucky Expo Center</text>
      <text x="130" y="332" fill="#b9c8d3" font-size="32">Bájate cerca de Gate 1, en Phillips Lane.</text>

      <text x="130" y="538" fill="#ffffff" font-size="44" font-weight="800">Regreso a downtown</text>
      <text x="130" y="585" fill="#b9c8d3" font-size="32">Aborda cerca de Gate 3, sobre Crittenden.</text>
      <text x="130" y="630" fill="#b9c8d3" font-size="32">Servicio hasta al menos medianoche.</text>
    </g>

    <g transform="translate(88 1515)">
      <rect x="0" y="0" width="904" height="220" rx="34" fill="#173247" stroke="#2c566f" stroke-width="2"/>
      <text x="40" y="66" fill="#ffca70" font-size="31" font-weight="800">ANTES DE SALIR</text>
      <text x="40" y="118" fill="#ffffff" font-size="33">Revisa las alertas de TARC: el servicio puede cambiar</text>
      <text x="40" y="160" fill="#ffffff" font-size="33">por clima, tráfico o instrucciones del festival.</text>
      <text x="40" y="202" fill="#9bd8cf" font-size="29" font-weight="700">Guárdalo y compártelo con tu grupo.</text>
    </g>

    <text x="88" y="1830" fill="#8fa5b4" font-size="25">Fuente: TARC / PARC • Información vigente para el fin de semana del 19–20 sep. 2026</text>
  </g>
</svg>