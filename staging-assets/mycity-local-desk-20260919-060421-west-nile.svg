<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="0.55" stop-color="#18302f"/>
      <stop offset="1" stop-color="#10241f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#7bdcb5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7bdcb5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <circle cx="910" cy="210" r="150" fill="#7bdcb5" opacity="0.08" filter="url(#soft)"/>
  <circle cx="155" cy="1520" r="180" fill="#ffc857" opacity="0.06" filter="url(#soft)"/>

  <text x="86" y="130" fill="#a8e7cf" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="3">MYCITY • LOUISVILLE</text>
  <text x="86" y="260" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800">Mosquitos:</text>
  <text x="86" y="355" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800">prevención local</text>
  <text x="86" y="430" fill="#c5d2cf" font-family="Arial, Helvetica, sans-serif" font-size="38">Aviso reciente de salud pública • 15 SEP 2026</text>

  <g transform="translate(86 535)">
    <rect x="0" y="0" width="908" height="560" rx="38" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="48" y="78" fill="#a8e7cf" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">ACTIVIDAD RECIENTE DETECTADA EN:</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#ffffff" font-weight="700">
      <circle cx="70" cy="158" r="10" fill="#7bdcb5"/><text x="105" y="171">Middletown • 40223</text>
      <circle cx="70" cy="232" r="10" fill="#7bdcb5"/><text x="105" y="245">Smoketown • 40203</text>
      <circle cx="70" cy="306" r="10" fill="#7bdcb5"/><text x="105" y="319">Shawnee / River Park • 40211</text>
      <circle cx="70" cy="380" r="10" fill="#7bdcb5"/><text x="105" y="393">Chickasaw • 40211</text>
      <circle cx="70" cy="454" r="10" fill="#7bdcb5"/><text x="105" y="467">Portland • 40212</text>
    </g>
  </g>

  <g transform="translate(86 1160)">
    <text x="0" y="0" fill="#ffc857" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">3 CASOS HUMANOS</text>
    <text x="0" y="50" fill="#dfe9e6" font-family="Arial, Helvetica, sans-serif" font-size="32">reportados en Jefferson County en 2026</text>
    <text x="0" y="92" fill="#9fb2ad" font-family="Arial, Helvetica, sans-serif" font-size="28">hasta el anuncio del 15 de septiembre.</text>
  </g>

  <g transform="translate(86 1345)">
    <rect x="0" y="0" width="908" height="330" rx="34" fill="#0a1714" opacity="0.66" stroke="#7bdcb5" stroke-opacity="0.28"/>
    <text x="42" y="64" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">Qué puedes hacer hoy</text>
    <text x="42" y="122" fill="#dfe9e6" font-family="Arial, Helvetica, sans-serif" font-size="31">• Vacía agua estancada una vez por semana.</text>
    <text x="42" y="174" fill="#dfe9e6" font-family="Arial, Helvetica, sans-serif" font-size="31">• Usa repelente registrado por EPA al salir.</text>
    <text x="42" y="226" fill="#dfe9e6" font-family="Arial, Helvetica, sans-serif" font-size="31">• Revisa los avisos locales de fumigación.</text>
    <text x="42" y="286" fill="#a8e7cf" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Alertas: envía LENSALERT al 67283</text>
  </g>

  <line x1="86" y1="1760" x2="994" y2="1760" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="86" y="1812" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">MyCity te cuenta • Fuente: Louisville Metro Public Health</text>
  <text x="86" y="1860" fill="#98aaa5" font-family="Arial, Helvetica, sans-serif" font-size="26">Información útil, local y verificada. MyCity no es una app oficial del gobierno.</text>
</svg>