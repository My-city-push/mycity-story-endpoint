      <stop offset="0" stop-color="#111111" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
