<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07153A"/>
      <stop offset="42%" stop-color="#123DFF"/>
      <stop offset="72%" stop-color="#C51BFF"/>
      <stop offset="100%" stop-color="#FF5A36"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FF7D7"/>
      <stop offset="100%" stop-color="#FFD84A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <circle cx="930" cy="170" r="180" fill="#2FF7D7" opacity="0.20"/>
  <circle cx="150" cy="1660" r="230" fill="#FFD84A" opacity="0.18"/>
  <path d="M0 460 C240 350, 360 590, 640 470 S1020 360,1080 440 L1080 760 C850 850,650 660,420 760 S120 860,0 760 Z" fill="#FFFFFF" opacity="0.06"/>

  <g opacity="0.9">
    <circle cx="117" cy="245" r="18" fill="#FFD84A"/>
    <circle cx="962" cy="520" r="12" fill="#2FF7D7"/>
    <circle cx="875" cy="1490" r="16" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="214" cy="1320" r="10" fill="#FF8A4C"/>
  </g>

  <g transform="translate(74 92)">
    <rect x="0" y="0" width="284" height="64" rx="32" fill="#07153A" opacity="0.78"/>
    <text x="142" y="42" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">PLAN GRATIS • LOUISVILLE</text>
  </g>

  <text x="74" y="300" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="900" letter-spacing="-4">
    <tspan x="74" dy="0">MARTES:</tspan>
    <tspan x="74" dy="116">SILENT DISCO</tspan>
  </text>
  <text x="78" y="560" fill="#2FF7D7" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">+ FOOD TRUCKS + PARQUE</text>

  <g transform="translate(640 610)" filter="url(#glow)">
    <circle cx="150" cy="150" r="146" fill="url(#orb)" opacity="0.95"/>
    <path d="M74 158 C74 72 226 72 226 158" fill="none" stroke="#07153A" stroke-width="30" stroke-linecap="round"/>
    <rect x="50" y="150" width="52" height="104" rx="24" fill="#07153A"/>
    <rect x="198" y="150" width="52" height="104" rx="24" fill="#07153A"/>
    <path d="M118 240 Q150 278 182 240" fill="none" stroke="#07153A" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g transform="translate(74 760)" filter="url(#shadow)">
    <rect width="560" height="500" rx="44" fill="#07153A" opacity="0.86"/>
    <text x="44" y="92" fill="#FFD84A" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900">MARTES 22 SEP</text>
    <text x="44" y="165" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">5:30–7:30 P.M.</text>
    <line x1="44" y1="207" x2="516" y2="207" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <text x="44" y="280" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800">JOE CREASON PARK</text>
    <text x="44" y="342" fill="#BEEBFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">Gratis • Todas las edades</text>
    <text x="44" y="408" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29">Audífonos inalámbricos, baile</text>
    <text x="44" y="448" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29">y food trucks en el parque.</text>
  </g>

  <g transform="translate(74 1340)">
    <rect width="932" height="310" rx="40" fill="#FFFFFF" opacity="0.96"/>
    <text x="46" y="78" fill="#07153A" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900">UN PLAN FAMILIAR SIN PAGAR ENTRADA</text>
    <text x="46" y="137" fill="#20315A" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">Louisville Parks &amp; Recreation celebra el inicio</text>
    <text x="46" y="181" fill="#20315A" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">del otoño con música y ambiente comunitario.</text>
    <rect x="46" y="224" width="486" height="58" rx="29" fill="#123DFF"/>
    <text x="289" y="263" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle">GUÁRDALO Y COMPÁRTELO</text>
  </g>

  <g transform="translate(74 1758)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" opacity="0.88">Fuente: Louisville Parks &amp; Recreation</text>
    <text x="0" y="46" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" opacity="0.75">Fall In Love With Parks &amp; Rec • 22 SEP 2026</text>
  </g>
