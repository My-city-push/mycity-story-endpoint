<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A2F"/>
      <stop offset="0.48" stop-color="#0B3650"/>
      <stop offset="1" stop-color="#0B7F7A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3DD"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#03101A" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="1000" cy="220" r="250" fill="#FF7A59" opacity="0.22"/>
  <circle cx="65" cy="1560" r="310" fill="#FFD166" opacity="0.16"/>
  <path d="M0 430 C260 310 510 520 1080 370 L1080 0 L0 0 Z" fill="#13B8A6" opacity="0.10"/>
  <path d="M0 1740 C300 1580 630 1810 1080 1630 L1080 1920 L0 1920 Z" fill="#FF7A59" opacity="0.13"/>

  <g transform="translate(70 90)">
    <rect width="240" height="72" rx="36" fill="#FFF3DD" opacity="0.96"/>
    <text x="120" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#071A2F">MyCity</text>
  </g>

  <text x="70" y="315" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF">Hazte visible</text>
  <text x="70" y="410" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#FFD166">donde vives.</text>
  <text x="74" y="500" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="500" fill="#D9F7F2">Tu negocio, servicio o evento puede aparecer</text>
  <text x="74" y="552" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="500" fill="#D9F7F2">frente a gente de Louisville y Kentuckiana.</text>

  <g transform="translate(72 650)" filter="url(#shadow)">
    <rect width="936" height="860" rx="54" fill="url(#card)"/>

    <g transform="translate(56 52)">
      <rect width="318" height="650" rx="42" fill="#10283A"/>
      <rect x="23" y="24" width="272" height="602" rx="30" fill="#F6FAF8"/>
      <rect x="47" y="62" width="224" height="115" rx="24" fill="#FF7A59"/>
      <text x="159" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">OFERTA HOY</text>
      <text x="159" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#FFF4E8">Cerca de ti</text>

      <rect x="47" y="207" width="224" height="126" rx="22" fill="#0FA89A"/>
      <circle cx="88" cy="250" r="20" fill="#FFF3DD"/>
      <rect x="120" y="229" width="112" height="16" rx="8" fill="#FFFFFF" opacity="0.93"/>
      <rect x="120" y="256" width="84" height="12" rx="6" fill="#FFFFFF" opacity="0.62"/>
      <rect x="72" y="292" width="155" height="13" rx="6" fill="#FFFFFF" opacity="0.70"/>

      <rect x="47" y="365" width="224" height="95" rx="22" fill="#FFD166"/>
      <text x="159" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#071A2F">EVENTO LOCAL</text>
      <text x="159" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#274259">Sábado • Louisville</text>

      <rect x="47" y="492" width="224" height="95" rx="22" fill="#EAF2F0"/>
      <text x="159" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#071A2F">NUEVO SERVICIO</text>
      <text x="159" y="561" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#5C6C72">Comunidad • Cerca</text>
    </g>

    <g transform="translate(430 76)">
      <rect x="0" y="0" width="430" height="130" rx="32" fill="#071A2F"/>
      <text x="34" y="52" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFD166">DATO DE LA PLATAFORMA</text>
      <text x="34" y="100" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">20,000+ usuarios</text>

      <g transform="translate(0 184)">
        <rect width="430" height="118" rx="30" fill="#FFFFFF"/>
        <circle cx="58" cy="59" r="28" fill="#FF7A59"/>
        <text x="106" y="50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#071A2F">PUBLICA OFERTAS</text>
        <text x="106" y="81" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#53656D">Promociones y novedades</text>
      </g>

      <g transform="translate(0 326)">
        <rect width="430" height="118" rx="30" fill="#FFFFFF"/>
        <circle cx="58" cy="59" r="28" fill="#13B8A6"/>
        <text x="106" y="50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#071A2F">ANUNCIA SERVICIOS</text>
        <text x="106" y="81" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#53656D">Haz que sepan qué haces</text>
      </g>

      <g transform="translate(0 468)">
        <rect width="430" height="118" rx="30" fill="#FFFFFF"/>
        <circle cx="58" cy="59" r="28" fill="#FFD166"/>
        <text x="106" y="50" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#071A2F">MANTENTE PRESENTE</text>
        <text x="106" y="81" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#53656D">Conecta con gente local</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 1575)">
    <rect width="936" height="210" rx="44" fill="#FF7A59"/>
    <text x="468" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">Tu comunidad ya está hablando.</text>
    <text x="468" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#FFF5EC">Pon tu negocio en la conversación.</text>
    <rect x="322" y="145" width="292" height="48" rx="24" fill="#071A2F"/>
    <text x="468" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">PUBLICA EN MYCITY</text>
  </g>

  <text x="540" y="1862" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#BFE8E3">“Más de 20,000 usuarios locales” es una cifra editorial proporcionada por MyCity.</text>
</svg>