ns-serif" font-size="35">en precios mayoristas de instalación solar</text><g transform="translate(138 830)"><rect x="0" y="0" width="365" height="185" rx="16" fill="#1f5f69"/><g stroke="#9ad7df" stroke-width="5" opacity="0.8"><line x1="0" y1="62" x2="365" y2="62"/><line x1="0" y1="123" x2="365" y2="123"/><line x1="91" y1="0" x2="91" y2="185"/><line x1="182" y1="0" x2="182" y2="185"/><line x1="273" y1="0" x2="273" y2="185"/></g><line x1="182" y1="185" x2="150" y2="240" stroke="#17202c" stroke-width="10"/><line x1="182" y1="185" x2="214" y2="240" stroke="#17202c" stroke-width="10"/><line x1="115" y1="240" x2="250" y2="240" stroke="#17202c" stroke-width="10"/></g><text x="560" y="852" fill="#17202c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Para propietarios,</text><text x="560" y="900" fill="#17202c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">pequeños negocios,</text><text x="560" y="948" fill="#17202c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">organizaciones sin fines</text><text x="560" y="996" fill="#17202c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">de lucro y lugares de culto.</text><rect x="86" y="1150" width="908" height="295" rx="34" fill="#132b37" stroke="#2f5666" stroke-width="2"/><text x="138" y="1235" fill="#91d7c5" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">TALLERES SOLAR 101</text><text x="138" y="1307" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">29 SEP · 7 PM · New Albany Central Library</text><text x="138" y="1362" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">30 SEP · 12–1 PM · PNC Tower, Louisville</text><text x="86" y="1535" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">También hay formulario de inscripción en español.</text><text x="86" y="1615" fill