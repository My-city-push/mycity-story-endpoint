<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08172e"/><stop offset="1" stop-color="#0c7d85"/></linearGradient><linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ff9b3d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".3"/></filter></defs><rect width="1080" height="1920" fill="url(#bg)"/><circle cx="930" cy="160" r="240" fill="#ffbf3f" opacity=".16"/><circle cx="100" cy="1600" r="260" fill="#15c6ba" opacity=".15"/><g transform="translate(76 90)"><text font-family="Arial" font-size="28" font-weight="700" fill="#bfe7e4">MYCITY • TARC</text><text y="106" font-family="Arial" font-size="78" font-weight="900" fill="#ffffff">RUTA 93</text><text y="168" font-family="Arial" font-size="31" font-weight="600" fill="#ffd75e">También cambia por el cierre en Broadway</text></g><g filter="url(#s)" transform="translate(76 370)"><rect width="928" height="500" rx="50" fill="#f9f3e8"/><rect x="42" y="42" width="260" height="62" rx="31" fill="#07152f"/><text x="172" y="84" text-anchor="middle" font-family="Arial" font-size="27" font-weight="900" fill="#ffffff">NORTHBOUND</text><text x="42" y="186" font-family="Arial" font-size="31" font-weight="800" fill="#0b2540">Paradas omitidas</text><text x="42" y="242" font-family="Arial" font-size="30" fill="#405066">Broadway desde Brook hasta 2nd St.</text><text x="42" y="332" font-family="Arial" font-size="27" font-weight="800" fill="#0c7d85">PARADA MÁS CERCANA</text><text x="42" y="391" font-family="Arial" font-size="36" font-weight="900" fill="#0b2540">Broadway @ 4th St.</text><text x="42" y="454" font-family="Arial" font-size="26" fill="#6b4b3e">TARC no lista un cambio southbound en esta alerta.</text></g><g transform="translate(76 1010)"><text x="0" y="0" font-family="Arial" font-size="56" font-weight="900" fill="#ffffff">ANTES DE SALIR</text><g transform="translate(0 78)"><rect width="928" height="110" rx="32" fill="#ffffff" opacity=".12"/><circle cx="58" cy="55" r="22" fill="#f8d04a"/><text x="105" y="68" font-family="Arial" font-size="29" font-weight="700" fill="#ffffff">Revisa tu parada y calcula tiempo extra.</text></g><g transform="translate(0 218)"><rect width="928" height="110" rx="32" fill="#ffffff" opacity=".12"/><circle cx="58" cy="55" r="22" fill="#15c6ba"/><text x="105" y="68" font-family="Arial" font-size="29" font-weight="700" fill="#ffffff">El desvío está previsto hasta el 10 de octubre.</text></g><g transform="translate(0 358)"><rect width="928" height="110" rx="32" fill="#ffffff" opacity=".12"/><circle cx="58" cy="55" r="22" fill="#ff6b4a"/><text x="105" y="68" font-family="Arial" font-size="29" font-weight="700" fill="#ffffff">Consulta RiderAlerts si la obra cambia.</text></g></g><g filter="url(#s)" transform="translate(76 1585)"><rect width="928" height="150" rx="42" fill="url(#cta)"/><text x="464" y="62" text-anchor="middle" font-family="Arial" font-size="31" font-weight="900" fill="#ffffff">COMPÁRTELO CON QUIEN USA TARC</text><text x="464" y="108" text-anchor="middle" font-family="Arial" font-size="25" font-weight="600" fill="#fff5ef">Una parada distinta puede cambiar todo el trayecto.</text></g><text x="76" y="1815" font-family="Arial" font-size="24" fill="#bfe7e4">Fuente oficial: TARC RiderAlert • 24 SEP 2026</text></svg>