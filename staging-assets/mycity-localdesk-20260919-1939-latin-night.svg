    <circle cx="53" cy="46" r="20" fill="#00E8D7"/>
    <text x="91" y="59" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="2">MYCITY TE CUENTA</text>
  </g>

  <g transform="translate(78 320)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF">MAÑANA</text>
    <text x="0" y="108" font-family="Arial, Helvetica, sans-serif" font-size="146" font-weight="900" fill="#FFFFFF">NOCHE</text>
    <text x="0" y="248" font-family="Arial, Helvetica, sans-serif" font-size="146" font-weight="900" fill="#FFCE3A">LATINA</text>
    <rect x="0" y="298" width="706" height="18" rx="9" fill="url(#hot)"/>
  </g>

  <g transform="translate(78 1050)" filter="url(#shadow)">
