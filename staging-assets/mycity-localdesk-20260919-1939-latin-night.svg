    <text x="52" y="82" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#00E8D7">DOMINGO · 20 SEP</text>
    <text x="52" y="152" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">5:30–9:00 PM</text>
    <text x="52" y="220" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="600" fill="#FFFFFF">DJ Xavi · salsa · música en vivo</text>
    <text x="52" y="274" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="600" fill="#FFFFFF">La Culebra · Henry Miles · Leo JM</text>
