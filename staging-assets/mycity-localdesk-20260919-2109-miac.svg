<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071CFF"/>
      <stop offset="0.45" stop-color="#5A18FF"/>
      <stop offset="1" stop-color="#E9008C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FE5D0"/>
      <stop offset="1" stop-color="#F9E547"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00104F" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="930" cy="220" r="250" fill="#FF7A3D" opacity="0.92"/>
  <circle cx="110" cy="1600" r="310" fill="#00D7C7" opacity="0.22"/>
  <path d="M0 1420 C260 1320 400 1520 640 1410 C830 1325 930 1350 1080 1290 L1080 1920 L0 1920 Z" fill="#061329" opacity="0.83"/>

  <g transform="translate(72 86)">
    <rect width="306" height="74" rx="37" fill="#FFFFFF" opacity="0.96"/>
    <text x="153" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">MyCity te cuenta</text>
  </g>

  <g transform="translate(760 118)">
    <circle cx="95" cy="95" r="95" fill="#F9E547"/>
    <path d="M46 92 C46 60 73 39 105 39 C137 39 163 61 163 92 C163 123 137 145 105 145 L83 145 L61 166 L66 135 C53 124 46 109 46 92 Z" fill="#111827"/>
    <circle cx="85" cy="91" r="7" fill="#F9E547"/>
    <circle cx="108" cy="91" r="7" fill="#F9E547"/>
    <circle cx="131" cy="91" r="7" fill="#F9E547"/>
  </g>

  <g transform="translate(72 320)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" fill="#D8FFF9" letter-spacing="3">PARTICIPACIÓN CÍVICA</text>
    <text x="0" y="180" font-family="Arial, Helvetica, sans-serif" font-size="152" font-weight="900" fill="#FFFFFF">TU VOZ</text>
    <text x="0" y="330" font-family="Arial, Helvetica, sans-serif" font-size="152" font-weight="900" fill="#F9E547">CUENTA</text>
    <text x="0" y="430" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="600" fill="#FFFFFF">Inmigrantes + refugiados en la mesa de Louisville</text>
  </g>

  <g transform="translate(72 900)" filter="url(#shadow)">
    <rect width="936" height="360" rx="52" fill="url(#card)"/>
    <text x="56" y="78" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#111827">PRÓXIMA REUNIÓN DEL MIAC</text>
    <text x="56" y="165" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" fill="#111827">LUN 21 SEP • 6–7 PM</text>
    <text x="56" y="238" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#111827">Jewish Family &amp; Career Services</text>
    <text x="56" y="292" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#111827">2821 Klempner Way • Louisville</text>
  </g>

  <g transform="translate(72 1330)">
    <rect width="936" height="220" rx="46" fill="#FFFFFF" opacity="0.97"/>
    <text x="48" y="70" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" fill="#071CFF">¿QUÉ HACE ESTE CONSEJO?</text>
    <text x="48" y="128" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#111827">Recoge necesidades de comunidades internacionales y</text>
    <text x="48" y="174" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#111827">recomienda mejoras en servicios y comunicación de la ciudad.</text>
  </g>

  <g transform="translate(72 1635)">
    <rect width="936" height="154" rx="42" fill="#FF7A3D"/>
    <text x="468" y="63" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">¿Qué necesidad de tu comunidad</text>
    <text x="468" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#111827">debería estar sobre esa mesa?</text>
  </g>

  <text x="72" y="1860" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#D8FFF9">Fuente: Louisville Metro • Office for Immigrant Affairs</text>
</svg>