<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Fin de semana en J-Town</title>
  <desc id="desc">Visual editorial de MyCity sobre el fin de semana principal del Gaslight Festival 2026 en Jeffersontown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1d2632"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="900" cy="180" r="280" fill="#ffb000" opacity=".12"/>
  <circle cx="120" cy="1580" r="360" fill="#18a0fb" opacity=".10"/>

  <text x="84" y="120" fill="#aab4c0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="4">MYCITY · LOCAL DESK</text>
  <text x="84" y="255" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">Fin de semana</text>
  <text x="84" y="355" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">en J-Town</text>
  <text x="84" y="425" fill="#ffbf47" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Gaslight Festival · Sept. 18–20</text>

  <g filter="url(#shadow)">
    <rect x="74" y="525" width="932" height="370" rx="42" fill="#ffffff"/>
    <text x="118" y="600" fill="#1a1f27" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">FIN DE SEMANA PRINCIPAL</text>
    <text x="118" y="680" fill="#10141a" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">200+ puestos de vendedores</text>
    <text x="118" y="742" fill="#3b4654" font-family="Arial, Helvetica, sans-serif" font-size="34">artesanías · comida · música · comunidad</text>
    <line x1="118" y1="792" x2="962" y2="792" stroke="#dce2e8" stroke-width="3"/>
    <text x="118" y="850" fill="#3b4654" font-family="Arial, Helvetica, sans-serif" font-size="31">Watterson Trail + Taylorsville Road</text>
  </g>

  <g transform="translate(84 990)">
    <rect width="912" height="360" rx="38" fill="#151c25" stroke="#3c4755" stroke-width="2"/>
    <text x="40" y="70" fill="#9fb0c3" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">HORARIOS</text>
    <text x="40" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">VIERNES 18</text>
    <text x="540" y="145" fill="#ffbf47" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">7–10 PM</text>
    <text x="40" y="225" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">SÁBADO 19</text>
    <text x="540" y="225" fill="#ffbf47" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">10 AM–10 PM</text>
    <text x="40" y="305" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">DOMINGO 20</text>
    <text x="540" y="305" fill="#ffbf47" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">12–6 PM</text>
  </g>

  <g transform="translate(84 1450)">
    <rect width="912" height="250" rx="38" fill="#ffbf47"/>
    <text x="44" y="72" fill="#13171d" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">IDEA LOCAL</text>
    <text x="44" y="135" fill="#13171d" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Compra, prueba y descubre</text>
    <text x="44" y="188" fill="#26303b" font-family="Arial, Helvetica, sans-serif" font-size="31">negocios y creadores de Kentuckiana.</text>
  </g>

  <text x="84" y="1800" fill="#d9e1e8" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">¿Qué negocio local recomiendas visitar?</text>
  <text x="84" y="1860" fill="#7f8b99" font-family="Arial, Helvetica, sans-serif" font-size="24">Fuente: Jeffersontown Chamber · Información consultada 18 Sep 2026</text>
</svg>