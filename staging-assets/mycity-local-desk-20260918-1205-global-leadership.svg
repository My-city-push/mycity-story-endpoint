      <stop offset="0" stop-color="#071116"/>
      <stop offset="0.58" stop-color="#10262A"/>
      <stop offset="1" stop-color="#17383A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55D6C2"/>
      <stop offset="1" stop-color="#F3C969"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="900" cy="310" r="220" fill="#2C8C83" opacity="0.16" filter="url(#soft)"/>
  <circle cx="140" cy="1510" r="260" fill="#DCA44C" opacity="0.11" filter="url(#soft)"/>

