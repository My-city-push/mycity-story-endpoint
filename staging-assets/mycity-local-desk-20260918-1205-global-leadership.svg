    <path d="M34 140c15-36 93-36 108 0" fill="none" stroke="#55D6C2" stroke-width="8" stroke-linecap="round"/>
    <circle cx="272" cy="88" r="88" fill="#F3C969" opacity="0.13"/>
    <path d="M225 92h94M272 45v94" stroke="#F3C969" stroke-width="9" stroke-linecap="round"/>
    <text x="398" y="45" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Aprende cómo funciona la ciudad.</text>
    <text x="398" y="94" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Conecta recursos. Crea redes.</text>
    <text x="398" y="143" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Lleva ideas a tu comunidad.</text>
  </g>

