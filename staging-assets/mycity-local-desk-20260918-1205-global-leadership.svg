    <text x="0" y="108" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF">LIDERAZGO</text>
    <text x="0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF">INMIGRANTE</text>
    <rect x="0" y="254" width="720" height="9" rx="4.5" fill="url(#glow)"/>
    <text x="0" y="346" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" fill="#D7E7E4">La Academia Global de Louisville</text>
    <text x="0" y="402" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" fill="#D7E7E4">cierra hoy su cohorte 2026.</text>
  </g>

  <g transform="translate(90 875)">
    <rect x="0" y="0" width="900" height="300" rx="36" fill="#FFFFFF" opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="38" y="70" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F3C969">¿QUÉ ABRE DESPUÉS?</text>
    <text x="38" y="132" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Las solicitudes para la cohorte 2027</text>
    <text x="38" y="180" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">abrirán en noviembre de 2026.</text>
    <text x="38" y="236" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#C9DBD8">Programa gratuito para líderes y profesionales</text>
    <text x="38" y="274" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#C9DBD8">que sirven a comunidades internacionales.</text>
  </g>

  <g transform="translate(90 1295)">
    <circle cx="88" cy="88" r="88" fill="#55D6C2" opacity="0.15"/>
