<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF5E6"/><stop offset="1" stop-color="#F7E8D0"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#FFC857"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0B2438" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="940" cy="165" r="230" fill="#13B8A6" opacity="0.14"/>
  <circle cx="70" cy="1770" r="230" fill="#FF7A59" opacity="0.13"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="74" y="112" fill="#12324A" font-size="40" font-weight="800">MYCITY • VIVIENDA</text>
    <text x="74" y="290" fill="#12324A" font-size="82" font-weight="900">Antes de aplicar,</text>
    <text x="74" y="382" fill="#12324A" font-size="82" font-weight="900">revisa esto</text>
    <rect x="72" y="470" width="936" height="1090" rx="54" fill="#FFFFFF" filter="url(#s)"/>

    <g fill="#153249">
      <circle cx="138" cy="620" r="34" fill="url(#accent)"/><text x="138" y="632" font-size="30" font-weight="900" text-anchor="middle" fill="#fff">1</text>
      <text x="208" y="605" font-size="43" font-weight="900">No puedes ser dueño actual</text>
      <text x="208" y="655" font-size="31" font-weight="600">de otra vivienda al solicitar.</text>

      <circle cx="138" cy="820" r="34" fill="#13B8A6"/><text x="138" y="832" font-size="30" font-weight="900" text-anchor="middle" fill="#fff">2</text>
      <text x="208" y="805" font-size="43" font-weight="900">Haz consejería de comprador</text>
      <text x="208" y="855" font-size="31" font-weight="600">mínimo 6 horas con agencia HUD.</text>

      <circle cx="138" cy="1020" r="34" fill="#FF7A59"/><text x="138" y="1032" font-size="30" font-weight="900" text-anchor="middle" fill="#fff">3</text>
      <text x="208" y="1005" font-size="43" font-weight="900">El ingreso del hogar importa</text>
      <text x="208" y="1055" font-size="31" font-weight="600">debe estar dentro del límite de 80% AMI.</text>

      <circle cx="138" cy="1220" r="34" fill="#FFC857"/><text x="138" y="1232" font-size="30" font-weight="900" text-anchor="middle" fill="#12324A">4</text>
      <text x="208" y="1205" font-size="43" font-weight="900">Pago mensual proyectado</text>
      <text x="208" y="1255" font-size="31" font-weight="600">PITI entre 25% y 30% del ingreso.</text>

      <circle cx="138" cy="1420" r="34" fill="#12324A"/><text x="138" y="1432" font-size="30" font-weight="900" text-anchor="middle" fill="#fff">5</text>
      <text x="208" y="1405" font-size="43" font-weight="900">Lender + realtor</text>
      <text x="208" y="1455" font-size="31" font-weight="600">son parte del proceso antes de aprobación.</text>
    </g>

    <rect x="72" y="1642" width="936" height="112" rx="56" fill="#12324A"/>
    <text x="540" y="1711" fill="#FFF5E6" font-size="34" font-weight="900" text-anchor="middle">Prepara documentos antes de entrar →</text>
    <text x="74" y="1842" fill="#5B6C7A" font-size="28" font-weight="700">Fuente: Louisville Metro Office of Housing • Otoño 2026</text>
  </g>
</svg>