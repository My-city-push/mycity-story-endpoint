    <text x="476" y="204" fill="#394150" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">por unidad</text>
    <text x="54" y="296" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900">50% PERDONABLE</text>
