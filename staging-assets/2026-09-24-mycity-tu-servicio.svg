      <stop offset="0" stop-color="#081b35"/>
      <stop offset="0.52" stop-color="#123f63"/>
      <stop offset="1" stop-color="#0aa6a6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f4d"/>
      <stop offset="1" stop-color="#ffb33b"/>
