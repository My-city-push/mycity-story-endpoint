        <circle cx="62" cy="61" r="34" fill="#ff6f4d"/>
        <path d="M47 63 l11 11 l22 -28" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="120" y="53" fill="#7d2c1f" font-size="27" font-weight="900">OFERTA HOY</text>
        <text x="120" y="87" fill="#4c4c4c" font-size="25">Promociones y novedades locales</text>
      </g>

      <g transform="translate(56 326)">
