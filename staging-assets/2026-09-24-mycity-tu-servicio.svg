        <text x="120" y="53" fill="#075f65" font-size="27" font-weight="900">SERVICIO CERCA</text>
        <text x="120" y="87" fill="#4c4c4c" font-size="25">Taller, barbería, limpieza, construcción...</text>
      </g>

      <g transform="translate(56 474)">
