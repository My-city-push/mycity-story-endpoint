<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Festival: parking más bus por 20 dólares</title>
  <desc id="desc">Story vertical de MyCity con una opción de estacionamiento downtown y TARC para eventos en Kentucky Expo Center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A52"/>
      <stop offset="0.36" stop-color="#0057FF"/>
      <stop offset="0.7" stop-color="#00D4C8"/>
      <stop offset="1" stop-color="#FF3D81"/>
    </linearGradient>
    <linearGradient id="price" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE75B"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001540" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="950" cy="120" r="280" fill="#FF3D81" opacity="0.28"/>
  <circle cx="85" cy="1640" r="330" fill="#FFE75B" opacity="0.18"/>
  <path d="M-40 430 C240 260 360 520 610 360 S990 180 1130 360" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="18"/>
  <path d="M-30 455 C250 285 370 545 620 385 S1000 205 1140 385" fill="none" stroke="#FFE75B" stroke-opacity="0.35" stroke-width="8" stroke-dasharray="18 24"/>

  <g transform="translate(72 88)">
    <rect x="0" y="0" width="250" height="58" rx="29" fill="#FFFFFF" opacity="0.16"/>
    <text x="125" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="2">MYCITY TE CUENTA</text>
  </g>

  <text x="72" y="280" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">FESTIVAL</text>
  <text x="72" y="372" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">SIN EL LÍO</text>
  <text x="72" y="464" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF">DEL PARKING</text>

  <g filter="url(#shadow)" transform="translate(72 560)">
    <rect x="0" y="0" width="936" height="390" rx="54" fill="#071A52" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="46" y="44" width="320" height="126" rx="34" fill="url(#price)"/>
    <text x="206" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" fill="#071A52">$20</text>
    <text x="410" y="84" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">GARAGE DOWNTOWN</text>
    <text x="410" y="128" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#BFFCF6">+ TARC ida y vuelta</text>
    <text x="410" y="169" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#BFFCF6">para todos en el vehículo</text>

    <line x1="46" y1="212" x2="890" y2="212" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
    <text x="46" y="266" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#FFFFFF">115 W. Jefferson</text>
    <text x="46" y="312" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#D8E4FF">Sube al #4 en 1st &amp; Liberty</text>
    <text x="46" y="354" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#D8E4FF">aprox. cada 15 min hasta 7 PM</text>
  </g>

  <g transform="translate(72 1030)">
    <rect x="0" y="0" width="936" height="250" rx="44" fill="#FFFFFF" fill-opacity="0.96"/>
    <g transform="translate(50 42)">
      <rect x="0" y="20" width="210" height="115" rx="24" fill="#0057FF"/>
      <rect x="28" y="42" width="154" height="42" rx="8" fill="#BFFCF6"/>
      <circle cx="52" cy="142" r="22" fill="#071A52"/>
      <circle cx="160" cy="142" r="22" fill="#071A52"/>
      <rect x="22" y="90" width="166" height="18" rx="9" fill="#FFE75B"/>
      <text x="105" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#071A52">#4</text>
    </g>
    <text x="320" y="74" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#071A52">REGRESO DESDE EL FESTIVAL</text>
    <text x="320" y="126" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#36466F">Crittenden Dr. • cerca de Gate 3</text>
    <text x="320" y="177" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#FF3D81">hasta al menos medianoche</text>
  </g>

  <g transform="translate(72 1360)">
    <rect x="0" y="0" width="420" height="86" rx="43" fill="#FFE75B"/>
    <text x="210" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#071A52">SEP 19–20</text>
    <text x="0" y="150" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800" fill="#FFFFFF">Louder Than Life termina el domingo.</text>
    <text x="0" y="202" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#E9F3FF">Antes de salir, revisa alertas de TARC</text>
    <text x="0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#E9F3FF">y del festival por posibles cambios.</text>
  </g>

  <g transform="translate(72 1690)">
    <rect x="0" y="0" width="936" height="130" rx="40" fill="#071A52" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2"/>
    <text x="42" y="55" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#BFFCF6">¿Te conviene dejar el carro downtown</text>
    <text x="42" y="94" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">y completar el viaje en bus?</text>
  </g>
</svg>