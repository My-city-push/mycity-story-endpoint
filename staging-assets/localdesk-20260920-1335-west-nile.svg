<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071B3D"/>
      <stop offset="0.46" stop-color="#053B78"/>
      <stop offset="1" stop-color="#00B8C8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#FF6B5E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00152D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="980" cy="150" r="310" fill="#FF3E8A" opacity="0.15"/>
  <circle cx="40" cy="1730" r="370" fill="#FFD84A" opacity="0.12"/>
  <path d="M0 340 C260 250 430 470 700 360 C865 292 970 300 1080 250 L1080 0 L0 0 Z" fill="#13D8E6" opacity="0.10"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF">
    <text x="72" y="112" font-size="36" font-weight="700" letter-spacing="3">LOUISVILLE • SALUD PÚBLICA</text>

    <g transform="translate(72 170)">
      <rect x="0" y="0" width="936" height="770" rx="44" fill="#051B36" opacity="0.82" filter="url(#shadow)"/>
      <rect x="44" y="48" width="338" height="54" rx="27" fill="url(#accent)"/>
      <text x="65" y="86" font-size="27" font-weight="800" fill="#071B3D" letter-spacing="1">DETECTADO EN MOSQUITOS</text>

      <text x="44" y="208" font-size="126" font-weight="900" letter-spacing="-4">WEST NILE</text>
      <text x="44" y="318" font-size="88" font-weight="800" fill="#7FF6FF">NUEVAS ZONAS</text>
      <text x="44" y="378" font-size="34" font-weight="500" fill="#D9F8FF">Actividad reciente en 5 áreas de Jefferson County.</text>

      <g transform="translate(44 430)">
        <rect x="0" y="0" width="420" height="118" rx="28" fill="#FFFFFF" opacity="0.10"/>
        <text x="28" y="44" font-size="28" font-weight="700" fill="#FFD84A">3 CASOS HUMANOS</text>
        <text x="28" y="84" font-size="25" fill="#FFFFFF">reportados en 2026 al 15 de septiembre</text>
      </g>

      <g transform="translate(500 425)">
        <ellipse cx="120" cy="85" rx="48" ry="66" fill="#FF6B5E" opacity="0.95"/>
        <circle cx="120" cy="25" r="28" fill="#FFD84A"/>
        <line x1="76" y1="55" x2="16" y2="14" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="164" y1="55" x2="224" y2="14" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="82" y1="91" x2="10" y2="98" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="158" y1="91" x2="230" y2="98" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="86" y1="120" x2="34" y2="168" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="154" y1="120" x2="206" y2="168" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="120" y1="0" x2="120" y2="-38" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      </g>

      <text x="44" y="620" font-size="30" font-weight="700" fill="#7FF6FF">DETECCIONES RECIENTES</text>
      <text x="44" y="670" font-size="28" font-weight="600">Middletown • Smoketown • Shawnee/River Park</text>
      <text x="44" y="714" font-size="28" font-weight="600">Chickasaw • Portland</text>
    </g>

    <g transform="translate(72 995)">
      <text x="0" y="0" font-size="52" font-weight="900">PROTÉGETE SIN COMPLICARTE</text>

      <g transform="translate(0 55)">
        <rect width="936" height="150" rx="34" fill="#FFFFFF" opacity="0.11"/>
        <circle cx="72" cy="75" r="38" fill="#FFD84A"/>
        <text x="60" y="88" font-size="42" font-weight="900" fill="#071B3D">1</text>
        <text x="132" y="64" font-size="32" font-weight="800">Usa repelente registrado por EPA</text>
        <text x="132" y="108" font-size="27" fill="#E9FCFF">especialmente al amanecer y al atardecer.</text>
      </g>

      <g transform="translate(0 230)">
        <rect width="936" height="150" rx="34" fill="#FFFFFF" opacity="0.11"/>
        <circle cx="72" cy="75" r="38" fill="#FF6B5E"/>
        <text x="60" y="88" font-size="42" font-weight="900">2</text>
        <text x="132" y="64" font-size="32" font-weight="800">Vacía agua estancada cada semana</text>
        <text x="132" y="108" font-size="27" fill="#E9FCFF">macetas, cubetas, canaletas y bebederos.</text>
      </g>

      <g transform="translate(0 405)">
        <rect width="936" height="150" rx="34" fill="#FFFFFF" opacity="0.11"/>
        <circle cx="72" cy="75" r="38" fill="#13D8E6"/>
        <text x="60" y="88" font-size="42" font-weight="900" fill="#071B3D">3</text>
        <text x="132" y="64" font-size="32" font-weight="800">Activa alertas de fumigación</text>
        <text x="132" y="108" font-size="27" fill="#E9FCFF">Envía “LENSALERT” al 67283.</text>
      </g>
    </g>

    <g transform="translate(72 1665)">
      <rect width="936" height="132" rx="36" fill="#FFD84A"/>
      <text x="42" y="56" font-size="31" font-weight="900" fill="#071B3D">INFO ÚTIL PARA TU FAMILIA</text>
      <text x="42" y="98" font-size="27" font-weight="700" fill="#071B3D">Comparte • revisa tu patio • evita picaduras</text>
    </g>

    <text x="72" y="1860" font-size="24" fill="#D8F7FB">Fuente: Louisville Metro Public Health &amp; Wellness • 15 SEP 2026</text>
  </g>
