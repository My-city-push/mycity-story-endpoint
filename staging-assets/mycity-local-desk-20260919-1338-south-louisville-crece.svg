<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1017ff"/>
      <stop offset="0.46" stop-color="#7b20ff"/>
      <stop offset="1" stop-color="#ff3f6f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10e7d0"/>
      <stop offset="1" stop-color="#d7ff3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#090622" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="935" cy="195" r="260" fill="#ffb000" opacity="0.92"/>
  <circle cx="120" cy="1660" r="310" fill="#10e7d0" opacity="0.85"/>
  <path d="M-40 520 C220 360 410 620 660 470 C820 375 990 365 1130 430" fill="none" stroke="#ffffff" stroke-width="22" opacity="0.15"/>
  <path d="M-80 1460 C230 1280 390 1510 650 1390 C855 1295 1000 1330 1140 1410" fill="none" stroke="#ffef68" stroke-width="14" opacity="0.26"/>

  <g transform="translate(74 92)">
    <rect x="0" y="0" width="390" height="66" rx="33" fill="#ffffff" opacity="0.95"/>
    <text x="32" y="43" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#1a1758" letter-spacing="2">MYCITY • LOCAL DESK</text>
  </g>

  <g transform="translate(72 290)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" fill="#ffffff">SOUTH</text>
    <text x="0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" fill="#ffffff">LOUISVILLE</text>
    <text x="0" y="232" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" fill="#ffef68">CRECE</text>
    <text x="3" y="304" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#ffffff">Una expansión local conecta negocio, logística y empleo.</text>
  </g>

  <g filter="url(#shadow)" transform="translate(70 730)">
    <rect x="0" y="0" width="940" height="520" rx="54" fill="#ffffff" opacity="0.97"/>

    <g transform="translate(54 56)">
      <rect x="0" y="0" width="250" height="150" rx="34" fill="url(#card)"/>
      <text x="28" y="67" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" fill="#13113b">$10.3M</text>
      <text x="28" y="112" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#13113b">INVERSIÓN</text>
    </g>

    <g transform="translate(345 56)">
      <rect x="0" y="0" width="250" height="150" rx="34" fill="#ff5a65"/>
      <text x="31" y="67" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" fill="#ffffff">20</text>
      <text x="31" y="111" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#ffffff">NUEVOS EMPLEOS</text>
    </g>

    <g transform="translate(636 56)">
      <rect x="0" y="0" width="250" height="150" rx="34" fill="#1d1b52"/>
      <text x="28" y="67" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" fill="#ffef68">2×</text>
      <text x="28" y="111" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#ffffff">ESPACIO OPERATIVO</text>
    </g>

    <text x="54" y="275" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="900" fill="#17153f">ABASTOS WHOLESALE</text>
    <text x="54" y="327" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#3b3a58">Louisville Metro destacó el 18 de agosto</text>
    <text x="54" y="369" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#3b3a58">su expansión planificada en South Louisville.</text>
    <text x="54" y="429" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17153f">Distribuye productos para mercados y restaurantes,</text>
    <text x="54" y="467" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17153f">incluyendo artículos de México y América Latina.</text>
  </g>

  <g transform="translate(82 1340)">
    <rect x="0" y="0" width="916" height="250" rx="44" fill="#14123e" opacity="0.93"/>
    <text x="48" y="70" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#10e7d0">EMPLEO + LOGÍSTICA + TECNOLOGÍA</text>
    <text x="48" y="120" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#ffffff">El acuerdo estatal de incentivos fijó una meta</text>
    <text x="48" y="164" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#ffffff">promedio de $31.50/h, incluyendo beneficios.</text>
    <text x="48" y="211" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#d8d7f2">Meta asociada al proyecto; no implica vacantes abiertas hoy.</text>
  </g>

  <g transform="translate(82 1653)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="900" fill="#17153f">¿Conoces otro negocio local que está creciendo?</text>
    <text x="0" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#17153f">Cuéntanos en MyCity.</text>
  </g>

  <g transform="translate(82 1818)">
    <rect x="0" y="0" width="390" height="48" rx="24" fill="#ffffff" opacity="0.92"/>
    <text x="22" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#17153f">FUENTES: LOUISVILLE METRO + KY CABINET</text>
  </g>
</svg>
