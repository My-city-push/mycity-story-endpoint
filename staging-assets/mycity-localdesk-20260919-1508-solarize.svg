<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0816FF"/>
      <stop offset="48%" stop-color="#00CFC8"/>
      <stop offset="100%" stop-color="#FF4F8B"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF33B"/>
      <stop offset="100%" stop-color="#FF9B2F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1138"/>
      <stop offset="100%" stop-color="#1F2C74"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00103C" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="908" cy="210" r="250" fill="#FFFFFF" opacity="0.09"/>
  <circle cx="135" cy="1550" r="285" fill="#FFF33B" opacity="0.10"/>
  <path d="M-60 640 C250 520 380 720 650 600 C870 500 960 520 1140 420 L1140 900 L-60 900 Z" fill="#FFFFFF" opacity="0.08"/>

  <g transform="translate(760 100)">
    <circle cx="115" cy="115" r="78" fill="url(#sun)"/>
    <g stroke="#FFF8B5" stroke-width="16" stroke-linecap="round" opacity="0.95">
      <line x1="115" y1="5" x2="115" y2="-35"/>
      <line x1="115" y1="225" x2="115" y2="265"/>
      <line x1="5" y1="115" x2="-35" y2="115"/>
      <line x1="225" y1="115" x2="265" y2="115"/>
      <line x1="37" y1="37" x2="8" y2="8"/>
      <line x1="193" y1="193" x2="222" y2="222"/>
      <line x1="193" y1="37" x2="222" y2="8"/>
      <line x1="37" y1="193" x2="8" y2="222"/>
    </g>
  </g>

  <g transform="translate(76 118)">
    <rect x="0" y="0" width="390" height="72" rx="36" fill="#0A1132" opacity="0.82"/>
    <text x="28" y="47" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="1.4">MYCITY TE CUENTA</text>
  </g>

  <g transform="translate(76 320)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="900" fill="#FFFFFF">
      <tspan x="0" dy="0">SOLAR</tspan>
      <tspan x="0" dy="112">CON DESCUENTO</tspan>
    </text>
    <text x="0" y="282" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#EFFFFF">Louisville mantiene abierta su compra colectiva</text>
    <text x="0" y="336" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#EFFFFF">para hogares y pequeños negocios.</text>
  </g>

  <g transform="translate(76 830)" filter="url(#shadow)">
    <rect x="0" y="0" width="928" height="360" rx="46" fill="#FFFFFF" opacity="0.96"/>
    <text x="44" y="74" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#17204F" letter-spacing="1.5">SOLARIZE LOUISVILLE 2026</text>
    <text x="44" y="180" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="900" fill="#0816FF">15–20%</text>
    <text x="430" y="167" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#17204F">descuento anunciado</text>
    <text x="430" y="215" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#17204F">en precios de instalación</text>
    <rect x="44" y="258" width="840" height="4" rx="2" fill="#D9E0FF"/>
    <text x="44" y="315" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#4B557D">Cotización gratuita • formulario disponible en español</text>
  </g>

  <g transform="translate(82 1250)">
    <g transform="rotate(-7 255 160)">
      <rect x="0" y="0" width="515" height="320" rx="28" fill="url(#panel)" stroke="#9DFDFF" stroke-width="7"/>
      <g stroke="#6DB9FF" stroke-width="4" opacity="0.72">
        <line x1="103" y1="0" x2="103" y2="320"/>
        <line x1="206" y1="0" x2="206" y2="320"/>
        <line x1="309" y1="0" x2="309" y2="320"/>
        <line x1="412" y1="0" x2="412" y2="320"/>
        <line x1="0" y1="80" x2="515" y2="80"/>
        <line x1="0" y1="160" x2="515" y2="160"/>
        <line x1="0" y1="240" x2="515" y2="240"/>
      </g>
      <path d="M35 48 L180 30 L90 144 Z" fill="#FFFFFF" opacity="0.12"/>
    </g>
    <g transform="translate(590 10)">
      <rect x="0" y="0" width="320" height="92" rx="46" fill="#FFF33B"/>
      <text x="160" y="61" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#17204F">CIERRA OCT. 1</text>
      <text x="0" y="150" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">También hay talleres</text>
      <text x="0" y="198" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">Solar 101:</text>
      <text x="0" y="250" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#F3FFFF">29 y 30 de septiembre</text>
    </g>
  </g>

  <g transform="translate(76 1712)">
    <rect x="0" y="0" width="928" height="118" rx="59" fill="#0A1132" opacity="0.90"/>
    <text x="464" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF">PIDE TU COTIZACIÓN ANTES DEL CIERRE →</text>
  </g>

  <text x="76" y="1880" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" opacity="0.82">Fuente: Louisville Metro • Solarize Louisville 2026</text>
</svg>