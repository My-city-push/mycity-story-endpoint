      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.38" stop-color="#10164a"/>
      <stop offset="0.72" stop-color="#082d43"/>
      <stop offset="1" stop-color="#031018"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e7ff"/>
