<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.38" stop-color="#062a78"/>
      <stop offset="0.72" stop-color="#6d0fe8"/>
      <stop offset="1" stop-color="#ff2f7d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#15ffb7" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="970" cy="190" r="220" fill="#ffd84d" opacity="0.18"/>
  <circle cx="120" cy="1680" r="300" fill="#00e5ff" opacity="0.12"/>
  <path d="M730 0 L1080 0 L1080 520 Z" fill="#ff8a34" opacity="0.24"/>
  <path d="M0 1160 C260 1020 480 1090 680 980 C835 895 930 740 1080 690 L1080 1170 C820 1245 610 1295 385 1365 C230 1415 105 1470 0 1530 Z" fill="#111827" opacity="0.48"/>

  <g transform="translate(72 82)">
    <rect x="0" y="0" width="270" height="78" rx="39" fill="#ffffff" opacity="0.96"/>
    <text x="135" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#111827" letter-spacing="2">MYCITY LOCAL</text>
  </g>

  <g transform="translate(72 255)">
    <rect x="0" y="0" width="205" height="205" rx="52" fill="#ffd84d" filter="url(#shadow)"/>
    <text x="102" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#111827">HOY</text>
    <text x="102" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#111827">21</text>
    <text x="102" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#111827" letter-spacing="3">SEPT</text>
  </g>

  <text x="72" y="585" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-2">VOZ INMIGRANTE</text>
  <text x="72" y="682" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-2">EN LOUISVILLE</text>
  <rect x="74" y="724" width="620" height="16" rx="8" fill="#ffd84d"/>

  <g transform="translate(72 808)" filter="url(#shadow)">
    <rect width="936" height="360" rx="48" fill="#ffffff" opacity="0.96"/>
    <text x="56" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#6d0fe8" letter-spacing="2">MIAC • CONSEJO INTERNACIONAL</text>
    <text x="56" y="160" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#111827">Reunión regular</text>
    <text x="56" y="225" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#111827">6–7 PM</text>
    <text x="56" y="286" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#4b5563">Jewish Family &amp; Career Services</text>
    <text x="56" y="329" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#4b5563">2821 Klempner Way • Louisville</text>
  </g>

  <g transform="translate(72 1230)">
    <rect width="936" height="260" rx="44" fill="url(#card)" filter="url(#shadow)"/>
    <text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" fill="#051018">¿QUÉ HACE ESTE CONSEJO?</text>
    <text x="52" y="132" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#051018">Conecta al gobierno local con comunidades</text>
    <text x="52" y="177" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#051018">inmigrantes y refugiadas para llevar necesidades,</text>
    <text x="52" y="222" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#051018">ideas y recomendaciones de servicio.</text>
  </g>

  <g transform="translate(72 1558)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#ffffff" opacity="0.9">REPRESENTACIÓN ACTUAL INCLUYE</text>
    <g transform="translate(0 38)">
      <rect x="0" y="0" width="260" height="76" rx="38" fill="#ff8a34"/>
      <text x="130" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#111827">MÉXICO</text>
      <rect x="286" y="0" width="230" height="76" rx="38" fill="#ffd84d"/>
      <text x="401" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#111827">CUBA</text>
      <rect x="542" y="0" width="394" height="76" rx="38" fill="#ffffff" opacity="0.95"/>
      <text x="739" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900" fill="#111827">Y MÁS COMUNIDADES</text>
    </g>
  </g>

  <text x="72" y="1785" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#ffffff">Conoce quién representa a tu comunidad.</text>
  <text x="72" y="1832" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#ffffff" opacity="0.82">Fuente: Louisville Metro • Office for Immigrant Affairs</text>
</svg>