<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Tu negocio puede crecer en Louisville</title>
  <desc id="desc">Story informativo de MyCity sobre la serie REACH for Small Business Growth de Louisville Metro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1A1F"/>
      <stop offset="1" stop-color="#173A3C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="930" cy="170" r="260" fill="#E58A4A" opacity="0.14"/>
  <circle cx="150" cy="1730" r="300" fill="#4AB7A5" opacity="0.10"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#F7F4EC">
    <text x="84" y="112" font-size="34" font-weight="700" letter-spacing="3">MYCITY • LOCAL DESK</text>
    <text x="84" y="226" font-size="82" font-weight="800">Tu negocio</text>
    <text x="84" y="314" font-size="82" font-weight="800">puede crecer</text>
    <text x="84" y="382" font-size="38" fill="#CFE7DF">Una ruta local para ordenar el próximo paso.</text>
  </g>

  <g transform="translate(84 478)" filter="url(#shadow)">
    <rect width="912" height="290" rx="42" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="48" y="52" width="210" height="186" rx="30" fill="#E58A4A"/>
    <text x="153" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102226">OCT</text>
    <text x="153" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="800" fill="#102226">3</text>
    <text x="304" y="98" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#A9D8CE">REACH • SMALL BUSINESS</text>
    <text x="304" y="155" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" fill="#FFFFFF">Business Health Check</text>
    <text x="304" y="205" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#E7F0ED">Formación • licencias • permisos</text>
    <text x="304" y="246" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#E7F0ED">y requisitos básicos del negocio</text>
  </g>

  <g transform="translate(84 838)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#A9D8CE" letter-spacing="2">LO QUE VIENE DESPUÉS</text>
    <g transform="translate(0 62)">
      <circle cx="34" cy="34" r="34" fill="#4AB7A5"/>
      <path d="M21 34h26M34 21v26" stroke="#102226" stroke-width="8" stroke-linecap="round"/>
      <text x="92" y="28" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">Finanzas y acceso a capital</text>
      <text x="92" y="68" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#CFE7DF">17 y 31 de octubre</text>
    </g>
    <g transform="translate(0 180)">
      <circle cx="34" cy="34" r="34" fill="#E58A4A"/>
      <path d="M19 39h30M25 27h18M29 15h10" stroke="#102226" stroke-width="7" stroke-linecap="round"/>
      <text x="92" y="28" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">Contratos y certificaciones</text>
      <text x="92" y="68" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#CFE7DF">14 de noviembre</text>
    </g>
    <g transform="translate(0 298)">
      <circle cx="34" cy="34" r="34" fill="#D8C77A"/>
      <path d="M18 45l16-24 16 24M24 40h20" stroke="#102226" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="28" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">Marketing y crecimiento</text>
      <text x="92" y="68" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#CFE7DF">21 de noviembre</text>
    </g>
    <g transform="translate(0 416)">
      <circle cx="34" cy="34" r="34" fill="#95A9C4"/>
      <path d="M19 25h30v25H19zM25 25v-8h18v8" fill="none" stroke="#102226" stroke-width="6"/>
      <text x="92" y="28" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">Oportunidades de storefront</text>
      <text x="92" y="68" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#CFE7DF">12 de diciembre</text>
    </g>
  </g>

  <g transform="translate(84 1456)" filter="url(#shadow)">
    <rect width="912" height="274" rx="40" fill="#F3EFE4"/>
    <text x="44" y="68" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#173A3C">SI TIENES UN FOOD TRUCK, SERVICIO,</text>
    <text x="44" y="110" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#173A3C">TIENDA O PEQUEÑO NEGOCIO…</text>
    <text x="44" y="166" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#102226">Llega con tus preguntas y tu próximo objetivo.</text>
    <text x="44" y="218" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#475B5B">Programa de Louisville Metro • Office for Immigrant Affairs</text>
  </g>

  <g transform="translate(84 1806)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#CFE7DF">MyCity te cuenta oportunidades locales. No somos una app oficial del gobierno.</text>
  </g>
</svg>