Reports must be authorized per owner, period and campaign; deduplicate profiles; mask recipient email and do not expose third-party private data.
Email identity mapping happens server-side against confirmed GoodBarber user records; ambiguous/unmatched addresses remain unattributed. An email open is a noisy signal, not confirmed human interest.
Delivery worker uses opted-in marketing recipients, suppression lists, unsubscribe links and per-recipient tracking tokens; batching never exposes recipient addresses. One feed post counts once; direct deliveries have a separate quota.
Business onboarding collects commercial name, responsible person, business type, location/service area, contact, materials and preferred presentation; evidence is appropriate to physical/mobile/online business. Payment never implies verification.
Scheduler must recheck paid entitlement, ownership, current follows, recipient exclusions and campaign limits before each publication.
*/
'use strict';
const cfg=window.MYCITY_PROMOTION_CONFIG||{};
const apiBase=cfg.apiBase||'https://mycity-story-endpoint.onrender.com/api/promotion';
const $=id=>document.getElementById(id);
// Read the existing chat's identity only for display. Server session remains authoritative.
function readAccountHint(){try{const viewer=JSON.parse(localStorage.getItem('mycity:chatViewer:v1')||'null');const snap=JSON.parse(localStorage.getItem('viewer.snapshot')||'null');return {id:String(viewer?.userId||viewer?.id||snap?.userId||snap?.id||localStorage.getItem('viewer.userId')||''),name:String(viewer?.name||viewer?.displayName||snap?.name||snap?.displayName||localStorage.getItem('viewer.name')||'')}}catch{return {id:'',name:''}}}
const accountHint=readAccountHint();$('accountHint').textContent=accountHint.name?'Cuenta en la app: '+accountHint.name:'';

let session=null,busy=false,file=null,poll=null,stopped=false,pendingRequest=null,identityGeneration=0;
$('send').disabled=true;
const seen=new Set();
function notice(t){$('notice').textContent=t}
function message(m){if(!m||!m.id||seen.has(m.id))return;seen.add(m.id);const row=document.createElement('div');row.className='messageRow '+(m.role==='user'?'mine':'');const g=document.createElement('div');g.className='msgGroup';if(m.text){const b=document.createElement('div');b.className='msgBubble';b.textContent=m.text;g.append(b)}for(const media of m.media||[]){let u;try{u=new URL(media.url);if(u.protocol!=='https:')continue}catch{continue}const el=document.createElement(String(media.type).startsWith('video')?'video':'img');el.src=u.href;if(el.tagName==='VIDEO'){el.controls=true;el.playsInline=true;el.preload='metadata'}else{el.alt='Material de promoción';el.loading='lazy'}const wrap=document.createElement('div');wrap.className='msgMedia';wrap.append(el);g.append(wrap)}row.append(g);$('messages').append(row);$('messages').scrollTop=$('messages').scrollHeight}
function nativeField(object,keys){for(const key of keys){const value=object?.[key];if(value!==undefined&&value!==null&&String(value).trim())return String(value).trim()}return ''}
function normalizeNativeUser(root){
if(!root||typeof root!=='object')return null;
const raw=[root.user,root.currentUser,root.data].find(v=>v&&typeof v==='object')||root;
const sources=[raw,root,raw.profile,root.profile,raw.user,raw.data].filter(Boolean);
const field=keys=>{for(const source of sources){const value=nativeField(source,keys);if(value)return value}return ''};
const yes=value=>['true','1','yes'].includes(String(value).toLowerCase());
const no=value=>['false','0','no'].includes(String(value).toLowerCase());
if(yes(field(['is_anonymous','isAnonymous','anonymous','is_guest','isGuest','guest']))||no(field(['isLoggedIn','loggedIn','authenticated','isAuthenticated'])))return null;
const id=field(['userId','user_id','userid','customer_id','customerId','id','uid','uuid','objectId','_id']);
const first=field(['firstname','first_name','firstName','given_name']);const last=field(['lastname','last_name','lastName','family_name']);
return {id,name:field(['displayName','fullName','fullname','name','username','login'])||(first+' '+last).trim(),jwt:field(['jwt'])};
}
async function request(path,options={},base=apiBase){const generation=identityGeneration;const headers=new Headers(options.headers||{});if(window.gb?.user?.getCurrent&&!cfg.getAccessToken){const user=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('No se pudo consultar tu sesión de My City.')),10000);gb.user.getCurrent(u=>{clearTimeout(timer);resolve(normalizeNativeUser(u))},()=>{clearTimeout(timer);reject(Error('Inicia sesión en My City.'))})});if(generation!==identityGeneration)throw Error('La cuenta cambió. Vuelve a abrir tu promoción.');if(session&&String(user?.id)!==String(session.user.id)){clearInterval(poll);poll=null;clearPrivateSession();throw Error('La cuenta cambió. Vuelve a abrir tu promoción.');}if(!user||typeof user!=='object')throw Error('No hay una cuenta iniciada en GoodBarber. Inicia sesión en My City.');if(!user.id)throw Error('GoodBarber devolvió una cuenta sin identificador.');$('accountHint').textContent='Cuenta detectada: '+(user.name||String(user.id));if(!user.jwt)throw Error('Cuenta detectada. GoodBarber no entregó el token de sesión; la verificación con el servidor sigue pendiente.');headers.set('Authorization','GoodBarber '+user.jwt);headers.set('X-MyCity-User-Id',String(user.id));}const provider=cfg.getAccessToken||(!headers.has('Authorization')?(()=>window.firebase?.auth?.().currentUser?.getIdToken()):null);if(typeof provider==='function'){const token=await provider();if(!token)throw Error('Inicia sesión para acceder a tu promoción.');headers.set('Authorization','Bearer '+token)}const r=await fetch(base+path,{...options,headers,credentials:'omit',signal:AbortSignal.timeout(65000)});if(generation!==identityGeneration)throw Error('La cuenta cambió. Vuelve a abrir tu promoción.');if(r.status===401)throw Error('Inicia sesión para acceder a tu promoción.');if(r.status===402)throw Error('La automatización requiere un plan activo.');if(r.status===404)throw Error('El servicio de Promoción todavía está pendiente de activación.');if(!r.ok){let error;try{error=await r.json()}catch{}throw Error(error?.error||'No se pudo conectar con Promoción. Inténtalo nuevamente.')}const result=await r.json();if(generation!==identityGeneration)throw Error('La cuenta cambió.');return result}
function apply(s){if(!s.user?.id)throw Error('El servidor no confirmó tu cuenta.');if(session&&String(s.user.id)!==String(session.user.id)){seen.clear();$('messages').replaceChildren()}session=s;$('accountHint').textContent='Cuenta confirmada: '+(s.user.name||s.user.id);$('status').textContent=s.entitlement?.active?'Plan activo · '+({active:'Promoción activa',paused:'En pausa',draft:'Preparando campaña',approved:'Borrador aprobado · envío pendiente'}[s.campaign?.status]||'Lista para configurar'):'Plan pendiente de activación';$('send').disabled=busy;for(const m of s.messages||[])message(m);notice(s.entitlement?.active?'Tus instrucciones se aplican únicamente a tu promoción.':'Puedes preparar tu promoción. La publicación automática requiere un plan activo.')}
async function refresh(){try{apply(await request('/session'))}catch(e){notice(e.message)}}
async function send(event){event?.preventDefault();if(busy)return;if(!session){notice('La conexión de Promoción aún no está disponible.');return}const text=$('input').value.trim();if(!text&&!file)return;busy=true;$('send').disabled=true;const data=new FormData();data.set('text',text);const fingerprint=text+'|'+(file?file.name+':'+file.size+':'+file.lastModified:'');if(!pendingRequest||pendingRequest.fingerprint!==fingerprint)pendingRequest={fingerprint,id:crypto.randomUUID()};data.set('clientRequestId',pendingRequest.id);if(file)data.set('media',file);try{const r=await request('/messages',{method:'POST',body:data});for(const m of r.messages||[])message(m);$('input').value='';file=null;pendingRequest=null;$('attachment').textContent='';notice('Solicitud enviada. My City responderá en esta conversación.')}catch(e){notice(e.message)}finally{busy=false;$('send').disabled=!session}}
$('form').addEventListener('submit',send);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{const f=$('file').files[0];$('file').value='';if(!f)return;if(!/^(image|video)\//.test(f.type)){notice('Selecciona una foto o un video.');return}if(f.size>20*1024*1024){notice('El archivo supera 20 MB.');return}file=f;$('attachment').textContent=f.name+' · ';const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Quitar';cancel.onclick=()=>{file=null;$('attachment').textContent=''};$('attachment').append(cancel)};
$('back').onclick=()=>history.length>1?history.back():location.assign(cfg.backUrl||'/perfil');
document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.prompt;$('input').focus()});document.querySelectorAll('[data-billing]').forEach(b=>b.onclick=async()=>{if(busy||!session)return;busy=true;b.disabled=true;try{const r=await request('/billing/'+b.dataset.billing,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const u=new URL(r.url);if(u.protocol!=='https:'||!['checkout.stripe.com','billing.stripe.com'].includes(u.hostname))throw Error('Enlace de pago inválido');location.assign(u.href)}catch(e){notice(e.message)}finally{busy=false;b.disabled=false}});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{if(busy||!session)return;busy=true;b.disabled=true;try{apply(await request('/campaign/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action,clientRequestId:crypto.randomUUID()})}))}catch(e){notice(e.message)}finally{busy=false;b.disabled=false;$('send').disabled=!session}});
const intro=document.createElement('div');intro.className='intro';const tag=document.createElement('span');tag.className='promoTag';tag.textContent='Tu espacio de promoción';const heading=document.createElement('h1');heading.textContent='Haz crecer tu negocio con My City';const p=document.createElement('p');p.textContent='Cuéntame qué ofreces. Aquí podrás preparar publicaciones, elegir seguidores o seguidos y ajustar tus días y horarios.';intro.append(tag,heading,p);$('messages').append(intro);
let startGeneration=0;
async function start(){const current=++startGeneration;clearInterval(poll);poll=null;try{const result=await request('/session');if(current!==startGeneration||stopped)return;apply(result);if(!stopped)poll=setInterval(()=>{if(!document.hidden&&!busy)refresh()},8000)}catch(e){if(current!==startGeneration||stopped)return;$('status').textContent='Conexión pendiente';notice(e.message+' Esta sección necesita que el servicio de promoción esté conectado.')}}
let panel='results',reportGeneration=0,reportTimer=null;
const labels={results:'Resultados',audience:'Mi audiencia',publications:'Publicaciones',deliveries:'Envíos',business:'Mi negocio'};
function node(tag,text,className){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n}
async function loadReport(){const generation=++reportGeneration;const content=$('reportContent');content.replaceChildren();$('reportStatus').textContent='Consultando…';const params=new URLSearchParams({period:$('reportPeriod').value,filter:$('reportFilter').value,q:$('reportSearch').value.trim()});try{const r=await request('/reports/'+panel+'?'+params);if(generation!==reportGeneration||!$('reportDialog').open)return;$('reportStatus').textContent=r.updatedAt?'Actualizado: '+new Date(r.updatedAt).toLocaleString('es'):'Sin fecha de actualización';if(panel==='publications'&&session?.campaign?.draft){const preview=node('div','','reportRow');preview.append(node('strong','Borrador: '+(session.campaign.draft.title||'Promoción')),node('p',session.campaign.draft.offer||'Aún sin contenido'),node('p','Audiencia: '+session.campaign.draft.audience+' · '+session.campaign.draft.time+' · '+session.campaign.draft.timezone));content.append(preview)}if(panel==='results'){const grid=node('div','','metricGrid');const metrics=[['appUniqueViews','Personas que vieron en My City'],['emailDelivered','Correos entregados'],['emailUniqueOpens','Aperturas únicas registradas'],['emailUniqueClicks','Destinatarios con clic'],['interested','Personas interesadas']];for(const [key,label] of metrics){const card=node('div','','metricCard');card.append(node('strong',r.metrics?.[key]??'—'),node('span',label));grid.append(card)}content.append(grid)}for(const item of r.items||[]){const row=node('div','','reportRow');row.append(node('strong',item.name||item.title||'Registro'));if(item.summary)row.append(node('p',item.summary));if(item.status)row.append(node('p',item.status));if(item.profileUrl){try{const u=new URL(item.profileUrl,location.origin);if(u.protocol==='https:'&&u.hostname==='www.mycity.city'&&u.pathname==='/public-profile'){const link=node('a','Ver perfil');link.href=u.href;row.append(link)}}catch{}}content.append(row)}if(!(r.items||[]).length&&panel!=='results')content.append(node('p','No hay registros para este periodo y filtro.','reportEmpty'));if(r.nextCursor)content.append(node('p','Se muestran los primeros registros. El listado completo requiere paginación del servicio.','reportHelp'))}catch(e){if(generation!==reportGeneration)return;$('reportStatus').textContent='Datos no disponibles';content.append(node('p',e.message+' Los resultados aparecerán cuando el servicio esté conectado.','reportEmpty'))}}
function openReport(name){panel=name;$('reportTitle').textContent=labels[name];$('reportFilter').hidden=!['results','audience'].includes(name);$('reportSearch').hidden=name==='business';$('reportPeriod').hidden=name==='business';$('reportHelp').textContent=name==='business'?'Tu identidad comercial debe coincidir con la cuenta responsable. Puedes corregirla desde el chat.':name==='deliveries'?'Los correos se enviarán por lotes a destinatarios habilitados. Se contabilizarán entregas, rebotes y bajas.':'Las aperturas de correo son aproximadas. Un perfil solo se atribuye cuando existe una coincidencia confirmada; clics y vistas en My City se muestran por separado.';$('reportDialog').showModal();loadReport()}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>openReport(b.dataset.panel));$('reportClose').onclick=()=>{$('reportDialog').close();reportGeneration++};$('reportDialog').addEventListener('close',()=>{reportGeneration++;clearTimeout(reportTimer)});$('reportRefresh').onclick=loadReport;['reportPeriod','reportFilter'].forEach(id=>$(id).onchange=loadReport);$('reportSearch').oninput=()=>{clearTimeout(reportTimer);reportTimer=setTimeout(loadReport,350)};$('askReport').onclick=()=>{$('reportDialog').close();$('input').value='Explícame '+labels[panel].toLowerCase()+' de '+($('reportPeriod').value==='7d'?'los últimos 7 días':'los últimos 30 días');$('input').focus()};

$('verifyAccount').onclick=async()=>{const generation=identityGeneration;const button=$('verifyAccount');button.disabled=true;notice('Comprobando tu sesión con My City…');try{const result=await request('',{method:'POST'},'https://mycity-story-endpoint.onrender.com/api/mycity/verify-session');if(generation!==identityGeneration)return;if(result.verified!==true||!result.user?.id)throw Error('No se pudo confirmar tu cuenta.');$('accountHint').textContent='Cuenta confirmada: '+result.user.id;$('status').textContent='Cuenta verificada · servicio de Promoción pendiente';notice('Tu sesión está confirmada. La activación del servicio de promoción se completa por separado.');}catch(error){if(generation===identityGeneration){$('status').textContent='Verificación pendiente';notice(error.message)}}finally{button.disabled=false}};

function clearPrivateSession(){identityGeneration++;session=null;seen.clear();pendingRequest=null;file=null;reportGeneration++;$('messages').replaceChildren();$('reportContent').replaceChildren();$('input').value='';$('attachment').replaceChildren();if($('reportDialog').open)$('reportDialog').close();$('accountHint').textContent='';$('send').disabled=true;notice('Inicia sesión para abrir tu promoción.')}
let nativeHooksInstalled=false;
function installNativeHooks(){if(nativeHooksInstalled)return true;if(!window.gb?.user?.getCurrent)return false;nativeHooksInstalled=true;function chain(target,key,handler){const previous=target[key];target[key]=function(...args){try{if(typeof previous==='function')previous.apply(this,args)}finally{handler()}}}const reopen=()=>{stopped=false;start()};chain(gb,'onappear',reopen);chain(gb,'onload',reopen);chain(gb.user,'onlogin',()=>{clearPrivateSession();reopen()});chain(gb.user,'onupdate',()=>{clearPrivateSession();reopen()});chain(gb.user,'onlogout',()=>{clearInterval(poll);poll=null;clearPrivateSession()});return true}
if(!installNativeHooks()){let attempts=0;const bridgeTimer=setInterval(()=>{if(installNativeHooks()){clearInterval(bridgeTimer);start()}else if(++attempts>=40)clearInterval(bridgeTimer)},250)}
window.addEventListener('pagehide',()=>{stopped=true;clearInterval(poll);poll=null});window.addEventListener('pageshow',()=>{if(stopped){stopped=false;start()}});start();
</script></body></html>
