GET /session -> { user:{id,name}, entitlement:{active}, campaign:{status}, messages:[{id,role,text,media:[{url,type}]}] }
POST /messages multipart (text, clientRequestId, optional media) -> {messages:[...]}; persist and enqueue once by clientRequestId.
POST /campaign/actions JSON {action:'pause'|'resume',clientRequestId} -> session shape.
GET /session returns asynchronous assistant replies and current campaign state.

GET /reports/{results|audience|publications|deliveries|business}?period=7d|30d&filter=all|app_view|email_open|email_click|interested&q=... -> { metrics:{appUniqueViews,emailDelivered,emailUniqueOpens,emailUniqueClicks,interested},items:[{id,name,title,summary,status,profileUrl}],updatedAt,nextCursor }.

Business onboarding collects commercial name, responsible person, business type, location/service area, contact, materials and preferred presentation; evidence is appropriate to physical/mobile/online business. Payment never implies verification.

}

async function loadReport(){const generation=++reportGeneration;const content=$('reportContent');content.replaceChildren();$('reportStatus').textContent='Consultando…';const params=new URLSearchParams({period:$('reportPeriod').value,filter:$('reportFilter').value,q:$('reportSearch').value.trim()});try{const r=await request('/reports/'+panel+'?'+params);if(generation!==reportGeneration||!$('reportDialog').open)return;$('reportStatus').textContent=r.updatedAt?'Actualizado: '+new Date(r.updatedAt).toLocaleString('es'):'Sin fecha de actualización';if(panel==='publications'&&session?.campaign?.draft){const preview=node('div','','reportRow');preview.append(node('strong','Borrador: '+(session.campaign.draft.title||'Promoción')),node('p',session.campaign.draft.offer||'Aún sin contenido'),node('p','Audiencia: '+session.campaign.draft.audience+' · '+session.campaign.draft.time+' · '+session.campaign.draft.timezone));content.append(preview)}if(panel==='results'){const grid=node('div','','metricGrid');const metrics=[['appUniqueViews','Personas que vieron en My City'],['emailDelivered','Correos entregados'],['emailUniqueOpens','Aperturas únicas registradas'],['emailUniqueClicks','Destinatarios con clic'],['interested','Personas interesadas']];for(const [key,label] of metrics){const card=node('div','','metricCard');card.append(node('strong',r.metrics?.[key]??'—'),node('span',label));grid.append(card)}content.append(grid)}for(const item of r.items||[]){const row=node('div','','reportRow');row.append(node('strong',item.name||item.title||'Registro'));if(item.summary)row.append(node('p',item.summary));if(item.status)row.append(node('p',item.status));if(item.profileUrl){try{const u=new URL(item.profileUrl,location.origin);if(u.protocol==='https:'&&u.hostname==='www.mycity.city'&&u.pathname==='/public-profile'){const link=node('a','Ver perfil');link.href=u.href;row.append(link)}}catch{}}content.append(row)}if(!(r.items||[]).length&&panel!=='results')content.append(node('p','No hay registros para este periodo y filtro.','reportEmpty'));if(r.nextCursor)content.append(node('p','Se muestran los primeros registros. El listado completo requiere paginación del servicio.','reportHelp'))}catch(e){if(generation!==reportGeneration)return;$('reportStatus').textContent='Datos no disponibles';content.append(node('p',e.message+' Los resultados aparecerán cuando el servicio esté conectado.','reportEmpty'))}}
function openReport(name){panel=name;$('reportTitle').textContent=labels[name];$('reportFilter').hidden=!['results','audience'].includes(name);$('reportSearch').hidden=name==='business';$('reportPeriod').hidden=name==='business';$('reportHelp').textContent=name==='business'?'Tu identidad comercial debe coincidir con la cuenta responsable. Puedes corregirla desde el chat.':name==='deliveries'?'Los correos se enviarán por lotes a destinatarios habilitados. Se contabilizarán entregas, rebotes y bajas.':'Las aperturas de correo son aproximadas. Un perfil solo se atribuye cuando existe una coincidencia confirmada; clics y vistas en My City se muestran por separado.';$('reportDialog').showModal();loadReport()}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>openReport(b.dataset.panel));$('reportClose').onclick=()=>{$('reportDialog').close();reportGeneration++};$('reportDialog').addEventListener('close',()=>{reportGeneration++;clearTimeout(reportTimer)});$('reportRefresh').onclick=loadReport;['reportPeriod','reportFilter'].forEach(id=>$(id).onchange=loadReport);$('reportSearch').oninput=()=>{clearTimeout(reportTimer);reportTimer=setTimeout(loadReport,350)};$('askReport').onclick=()=>{$('reportDialog').close();$('input').value='Explícame '+labels[panel].toLowerCase()+' de '+($('reportPeriod').value==='7d'?'los últimos 7 días':'los últimos 30 días');$('input').focus()};

const verificationBase=cfg.verificationBase||'https://mycity-story-endpoint.onrender.com/api/mycity/email-verification';
const verifyDialog=document.createElement('dialog');verifyDialog.className='promoDialog';verifyDialog.innerHTML='<form id="verificationForm"><h2>Verifica tu cuenta</h2><p id="verificationHelp">Enviaremos un código al correo registrado en My City.</p><label>Código de 6 dígitos<input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><p id="verificationError" role="status"></p><button type="submit" id="verificationSubmit">Confirmar código</button><button type="button" id="verificationCancel">Cerrar</button></form>';document.body.append(verifyDialog);
async function verificationUser(){if(!window.gb?.user?.getCurrent)throw Error('Abre esta sección dentro de My City con tu cuenta iniciada.');return await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('No se pudo consultar tu cuenta.')),10000);gb.user.getCurrent(raw=>{clearTimeout(timer);const user=normalizeNativeUser(raw);if(!user?.id)reject(Error('Inicia sesión en My City.'));else resolve(user)},()=>{clearTimeout(timer);reject(Error('Inicia sesión en My City.'))})})}
async function verificationPost(path,body){const response=await fetch(verificationBase+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'omit',signal:AbortSignal.timeout(35000)});let result;try{result=await response.json()}catch{throw Error('No se pudo conectar con la verificación.')}if(!response.ok)throw Error(result.error||'No se pudo verificar la cuenta.');return result}
$('verificationCancel').onclick=()=>verifyDialog.close();
$('verifyAccount').onclick=async()=>{const generation=identityGeneration;const button=$('verifyAccount');button.disabled=true;notice('Enviando un código al correo registrado…');try{const user=await verificationUser();if(generation!==identityGeneration)return;await restoreSession();if(generation!==identityGeneration)return;if(emailAccess&&emailAccess.userId===String(user.id)){await start();notice('Tu cuenta ya está verificada en este dispositivo.');return;}const result=await verificationPost('/start',{userId:String(user.id)});if(generation!==identityGeneration)return;emailChallenge={...result,userId:String(user.id)};$('verificationHelp').textContent=result.message+' El código vence en 10 minutos.';$('verificationCode').value='';$('verificationError').textContent='';verifyDialog.showModal();$('verificationCode').focus();notice('Revisa el correo de tu cuenta y escribe el código.');}catch(error){if(generation===identityGeneration)notice(error.message)}finally{button.disabled=false}};
$('verificationForm').onsubmit=async event=>{event.preventDefault();const generation=identityGeneration;const button=$('verificationSubmit');button.disabled=true;try{const user=await verificationUser();if(generation!==identityGeneration)return;if(!emailChallenge||emailChallenge.userId!==String(user.id))throw Error('La cuenta cambió. Solicita un código nuevo.');const result=await verificationPost('/confirm',{challengeId:emailChallenge.challengeId,userId:String(user.id),code:$('verificationCode').value.trim(),deviceId});if(generation!==identityGeneration)return;if(result.verified!==true||String(result.user?.id)!==String(user.id)||!result.accessToken)throw Error('Respuesta de verificación inválida.');emailAccess={userId:String(user.id),token:result.accessToken,expiresAt:result.expiresAt,deviceId};rememberSession();emailChallenge=null;verifyDialog.close();$('accountHint').textContent='Cuenta confirmada: '+(result.user.name||user.name||user.id);$('status').textContent='Cuenta verificada';notice('Cuenta verificada. Conectando tu espacio de promoción…');await start();}catch(error){if(generation===identityGeneration)$('verificationError').textContent=error.message}finally{button.disabled=false}};

function clearPrivateSession(){if(!emailAccess){try{emailAccess=JSON.parse(localStorage.getItem(rememberedSessionKey)||'null')}catch{}}if(emailAccess)fetch(verificationBase+'/logout',{method:'POST',headers:{Authorization:'Promotion '+emailAccess.token},credentials:'omit'}).catch(()=>{});emailAccess=null;rememberSession();emailChallenge=null;if(verifyDialog.open)verifyDialog.close();identityGeneration++;session=null;seen.clear();pendingRequest=null;file=null;reportGeneration++;$('messages').replaceChildren();$('locations').replaceChildren();if($('locationDialog')?.open)$('locationDialog').close();if($('locationForm')){searchGeneration++;addDialog.close();$('locationForm').reset();pickerChosen=false;if(pickerMap){pickerMap.remove();pickerMap=null;pickerMarker=null;pickerCircle=null;}$('addressResults').replaceChildren();$('pointDetails').textContent='Selecciona el punto exacto en el mapa.';$('pointConfirmed').disabled=true;}$('reportContent').replaceChildren();$('input').value='';$('attachment').replaceChildren();if($('reportDialog').open)$('reportDialog').close();$('accountHint').textContent='';$('send').disabled=true;notice('Inicia sesión para abrir tu promoción.')}
let nativeHooksInstalled=false;
function installNativeHooks(){if(nativeHooksInstalled)return true;if(!window.gb?.user?.getCurrent)return false;nativeHooksInstalled=true;function chain(target,key,handler){const previous=target[key];target[key]=function(...args){try{if(typeof previous==='function')previous.apply(this,args)}finally{handler()}}}const reopen=()=>{stopped=false;start()};chain(gb,'onappear',reopen);chain(gb,'onload',reopen);chain(gb.user,'onlogin',reopen);chain(gb.user,'onupdate',reopen);chain(gb.user,'onlogout',()=>{clearInterval(poll);poll=null;clearPrivateSession()});return true}
if(!installNativeHooks()){let attempts=0;const bridgeTimer=setInterval(()=>{if(installNativeHooks()){clearInterval(bridgeTimer);start()}else if(++attempts>=40)clearInterval(bridgeTimer)},250)}

let selectedZone=null;
const locationDialog=document.createElement('dialog');locationDialog.id='locationDialog';locationDialog.className='promoDialog locationSheet';locationDialog.innerHTML='<div class="handle"></div><div class="reportTop"><h2 id="zoneTitle">Ubicación</h2><button type="button" class="iconBtn" id="zoneClose" aria-label="Cerrar ubicación">×</button></div><div id="zoneState" class="zoneNote"></div><div id="zoneMap" class="zoneMap"></div><label for="zoneMessage">Mensaje propuesto</label><textarea id="zoneMessage" class="zoneMessage" maxlength="240" placeholder="Escribe el aviso que quieres preparar"></textarea><p class="zoneNote" id="zonePayment"></p><div class="zoneActions"><button type="button" data-zone-action="edit_message">Guardar propuesta</button><button type="button" data-zone-action="edit_schedule">Ajustar horario</button><button type="button" data-zone-action="pause">Solicitar pausa</button><button type="button" data-zone-action="activate">Solicitar activación</button></div><p class="zoneNote" id="zoneResult">Los cambios requieren aplicación y confirmación en GoodBarber.</p>';document.body.append(locationDialog);
function renderLocations(zones){$('locations').replaceChildren();for(const zone of zones){const card=document.createElement('button');card.type='button';card.className='locationCard';const name=document.createElement('strong');name.textContent=zone.name;const badge=document.createElement('span');badge.className='zoneBadge';badge.textContent=zone.pendingAction?'Solicitud pendiente':zone.bindingStatus==='draft'?(session?.capabilities?.geofenceFreePilot?'Propuesta · prueba gratuita':'Propuesta · sin pagar'):'Ubicación vinculada';const detail=document.createElement('span');detail.textContent='Radio observado: '+(zone.observedRadiusMeters??'—')+' m · Aviso comercial pendiente';card.append(name,badge,detail);card.onclick=()=>openLocation(zone);$('locations').append(card)}if(!zones.length){const card=document.createElement('button');card.type='button';card.className='locationCard';card.textContent='＋ Comencemos con tu primera ubicación';card.onclick=()=>$('addLocation').click();$('locations').append(card)}}
function openLocation(zone){selectedZone=zone;$('zonePayment').textContent=session?.capabilities?.geofenceFreePilot?'Prueba gratuita: prepara mensajes y solicita activaciones sin pago.':'Servicio propuesto: $9.99 por 30 días. El pago de geofencing todavía no está habilitado.';$('zoneTitle').textContent=zone.name;$('zoneState').textContent=zone.pendingAction?'Solicitud pendiente de aplicar':'Ubicación vinculada. Configuración comercial pendiente.';$('zoneMap').replaceChildren();if(Number.isFinite(zone.latitude)&&Number.isFinite(zone.longitude)){const map=document.createElement('iframe');map.title='Mapa de '+zone.name;map.style='width:100%;height:100%;border:0;border-radius:16px';map.referrerPolicy='no-referrer';map.loading='lazy';const box=[zone.longitude-.003,zone.latitude-.002,zone.longitude+.003,zone.latitude+.002].join(',');map.src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(box)+'&layer=mapnik&marker='+encodeURIComponent(zone.latitude+','+zone.longitude);$('zoneMap').append(map);}else $('zoneMap').textContent='Mapa pendiente de confirmar · radio observado '+(zone.observedRadiusMeters??'—')+' metros';$('zoneMessage').value=zone.proposedMessage||'';$('zoneResult').textContent='El aviso existente de inspecciones se conserva. No hay cambios confirmados.';locationDialog.showModal()}
$('zoneClose').onclick=()=>locationDialog.close();
const addDialog=document.createElement('dialog');addDialog.className='promoDialog locationSheet';addDialog.innerHTML='<div class="handle"></div><form id="locationForm"><div class="reportTop"><h2>Ubica tu negocio</h2><button type="button" class="iconBtn" id="addClose" aria-label="Cerrar">×</button></div><label>Nombre del negocio<input id="addName" required maxlength="120" placeholder="Nombre de tu negocio"></label><label>Dirección exacta<input id="addAddress" required maxlength="240" placeholder="Calle, número, ciudad y código postal"></label><button type="button" id="findAddress" class="mapSearchBtn">Buscar dirección</button><div id="addressResults" class="addressResults"></div><div id="locationPickerMap" aria-label="Mapa para ubicar el negocio"></div><p class="zoneNote">Arrastra el pin o toca el mapa para fijar la entrada de tu negocio.</p><label for="addRadius">Radio de alcance: <output id="radiusValue">150 metros</output><input id="addRadius" type="range" min="100" max="150" step="1" value="150"></label><div class="radiusLimits"><span>100 metros</span><span>150 metros</span></div><div id="pointDetails" class="zoneNote">Elige el punto exacto en el mapa.</div><input id="addLat" type="hidden"><input id="addLng" type="hidden"><label class="confirmPoint"><input type="checkbox" id="pointConfirmed" disabled required> Confirmo que el pin está en mi negocio</label><p id="addError" class="zoneNote" role="status"></p><button type="submit" id="saveLocation">Guardar ubicación</button><p class="zoneNote">Guardaremos dirección, coordenadas y radio. Después prepararemos el mensaje de tu aviso.</p></form>';document.body.append(addDialog);
let pickerMap=null,pickerMarker=null,pickerCircle=null,pickerLoad=null,pickerChosen=false,searchGeneration=0;
const assetBase=new URL(apiBase,location.href);assetBase.pathname=assetBase.pathname.replace(/\/api\/promotion\/?$/,'');assetBase.search='';assetBase.hash='';
function pickerAssets(){if(window.L)return Promise.resolve();if(pickerLoad)return pickerLoad;pickerLoad=new Promise((resolve,reject)=>{const css=document.createElement('link');css.rel='stylesheet';css.href=assetBase.href.replace(/\/$/,'')+'/vendor/leaflet/leaflet.css';document.head.append(css);const js=document.createElement('script');js.src=assetBase.href.replace(/\/$/,'')+'/vendor/leaflet/leaflet.js';js.onload=()=>resolve();js.onerror=()=>{pickerLoad=null;js.remove();reject(Error('No se pudo cargar el mapa. Intenta abrirlo nuevamente.'))};document.head.append(js)});return pickerLoad}
function setPickerPoint(point){pickerChosen=true;pickerMarker.setLatLng(point);pickerCircle.setLatLng(point);$('addLat').value=point.lat.toFixed(7);$('addLng').value=point.lng.toFixed(7);$('pointDetails').textContent='Punto elegido: '+point.lat.toFixed(6)+', '+point.lng.toFixed(6);$('pointConfirmed').disabled=false;$('pointConfirmed').checked=false;}
async function openPicker(){addDialog.showModal();$('addError').textContent='';if(!$('addName').value)$('addName').value=session?.business?.commercialName||session?.user?.name||'';try{await pickerAssets();if(!addDialog.open)return;if(!pickerMap){const known=(session?.geofences||[]).find(z=>Number.isFinite(z.latitude)&&Number.isFinite(z.longitude));const center=known?[known.latitude,known.longitude]:[38.2527,-85.7585];pickerMap=L.map('locationPickerMap',{scrollWheelZoom:false}).setView(center,known?17:12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(pickerMap);const icon=L.divIcon({className:'businessPin',html:'<span aria-hidden="true">📍</span>',iconSize:[40,46],iconAnchor:[20,43]});pickerMarker=L.marker(center,{draggable:true,icon,keyboard:true,title:'Arrastra el pin a la entrada del negocio'}).addTo(pickerMap);pickerCircle=L.circle(center,{radius:Number($('addRadius').value),color:'#2868d9',fillOpacity:.14,weight:2}).addTo(pickerMap);pickerMarker.on('drag',()=>pickerCircle.setLatLng(pickerMarker.getLatLng()));pickerMarker.on('dragend',()=>setPickerPoint(pickerMarker.getLatLng()));pickerMap.on('click',e=>setPickerPoint(e.latlng));}requestAnimationFrame(()=>pickerMap.invalidateSize());}catch(error){$('addError').textContent=error.message}}
$('addLocation').onclick=openPicker;$('addClose').onclick=()=>{searchGeneration++;addDialog.close()};
$('addAddress').addEventListener('input',()=>{searchGeneration++;$('addressResults').replaceChildren();$('pointConfirmed').checked=false;});
$('addRadius').oninput=()=>{$('radiusValue').textContent=$('addRadius').value+' metros';pickerCircle?.setRadius(Number($('addRadius').value));$('pointConfirmed').checked=false;};
$('findAddress').onclick=async()=>{const query=$('addAddress').value.trim();if(query.length<5){$('addError').textContent='Escribe la dirección completa para buscarla.';return;}if(!session){$('addError').textContent='Verifica tu cuenta para buscar y guardar una dirección. Puedes explorar el mapa.';return;}const generation=++searchGeneration;$('findAddress').disabled=true;$('addError').textContent='Buscando dirección…';try{const response=await request('/geofences/search?q='+encodeURIComponent(query));if(generation!==searchGeneration||!addDialog.open)return;$('addressResults').replaceChildren();for(const result of response.results||[]){const button=document.createElement('button');button.type='button';button.textContent=result.label;button.onclick=()=>{setPickerPoint(L.latLng(result.latitude,result.longitude));pickerMap.setView([result.latitude,result.longitude],18);$('addressResults').replaceChildren();$('addError').textContent='Revisa el pin y ajústalo si hace falta. La dirección que escribiste se conserva.';};$('addressResults').append(button)}$('addError').textContent=response.results?.length?'Selecciona la dirección correcta.':'No encontramos esa dirección. Puedes buscar otra o elegir el punto directamente en el mapa.';}catch(error){if(generation===searchGeneration)$('addError').textContent=error.message;}finally{$('findAddress').disabled=false}};
$('locationForm').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!session){$('addError').textContent='Verifica tu cuenta antes de guardar la ubicación.';return;}if(!pickerChosen||!$('pointConfirmed').checked){$('addError').textContent='Elige el punto y confirma que el pin está en tu negocio.';return;}busy=true;$('saveLocation').disabled=true;try{const savedName=$('addName').value;apply(await request('/geofences/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientRequestId:crypto.randomUUID(),name:savedName,address:$('addAddress').value,latitude:Number($('addLat').value),longitude:Number($('addLng').value),radius:Number($('addRadius').value),pointConfirmed:true,coordinateSource:'user_map'})}));addDialog.close();$('locationForm').reset();$('radiusValue').textContent='150 metros';pickerCircle?.setRadius(150);pickerChosen=false;$('pointConfirmed').disabled=true;$('pointDetails').textContent='Elige el punto exacto en el mapa.';$('input').value='Quiero preparar el mensaje de la ubicación '+savedName+'.';$('input').focus();}catch(error){$('addError').textContent=error.message}finally{busy=false;$('saveLocation').disabled=false}};
document.querySelectorAll('[data-zone-action]').forEach(button=>button.onclick=async()=>{if(!selectedZone||busy||!session)return;const action=button.dataset.zoneAction;if(action==='edit_schedule'){locationDialog.close();$('input').value='Quiero proponer un horario para la ubicación '+selectedZone.name+'. Ayúdame a elegir días, franja horaria y repetición.';$('input').focus();return;}const text=$('zoneMessage').value.trim();if(action==='edit_message'&&!text){$('zoneResult').textContent='Escribe primero el mensaje propuesto.';return;}busy=true;button.disabled=true;try{const result=await request('/geofences/'+encodeURIComponent(selectedZone.geofenceId||selectedZone.id)+'/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,message:text,clientRequestId:crypto.randomUUID()})});apply(result);locationDialog.close();notice('Solicitud guardada. La confirmación aparecerá cuando se aplique en GoodBarber.')}catch(e){$('zoneResult').textContent=e.message}finally{busy=false;button.disabled=false;$('send').disabled=!session}});
