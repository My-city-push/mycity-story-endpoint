<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My City · Verificar sesión</title><style>body{font:16px system-ui;background:#080c14;color:#f4f6fb;max-width:520px;margin:40px auto;padding:24px}button{font:inherit;border:0;border-radius:12px;padding:14px;background:#4495ff;color:white}p{line-height:1.6}#result{white-space:pre-wrap}small{color:#a9b8cc}</style></head><body><h1>Verifica tu cuenta de My City</h1><p>Esta prueba confirma qué cuenta está iniciada. No activa promociones ni cobra pagos.</p><button id="check">Comprobar mi sesión</button><p id="result" role="status">Abre esta sección desde My City.</p><small>No se muestran ni guardan tus tokens de sesión.</small><script>
'use strict';const button=document.getElementById('check'),result=document.getElementById('result');let generation=0;
async function check(){const current=++generation;button.disabled=true;result.textContent='Comprobando…';try{
if(!window.gb?.user?.getCurrent)throw Error('Instala esta prueba como sección Custom Code de GoodBarber y ábrela dentro de My City. El navegador externo no recibe la sesión nativa.');
const user=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('My City no respondió. Vuelve a abrir la sección.')),10000);gb.user.getCurrent(u=>{clearTimeout(timer);resolve(u)},()=>{clearTimeout(timer);reject(Error('Inicia sesión en My City y vuelve a comprobar.'))});});
if(current!==generation)return;
if(!user?.jwt||!user?.id)throw Error('Tu cuenta no entrega un token compatible. Revisa la versión de la app: API 2/3 y compilación posterior al 14 de septiembre de 2026.');
const response=await fetch('https://mycity-story-endpoint.onrender.com/api/mycity/verify-session',{method:'POST',headers:{Authorization:'GoodBarber '+user.jwt,'X-MyCity-User-Id':String(user.id)},signal:AbortSignal.timeout(15000)});
const data=await response.json();if(current!==generation)return;if(!response.ok)throw Error(data.error||'No se pudo comprobar la cuenta.');if(data.verified!==true||String(data.user?.id)!==String(user.id))throw Error('La respuesta no confirmó esta cuenta.');result.textContent='Cuenta confirmada: '+data.user.id+'\nAhora cierra sesión, entra con otra cuenta y vuelve a comprobar.';
}catch(error){if(current===generation)result.textContent=error.message;}finally{button.disabled=false;}}
button.onclick=check;if(window.gb?.user){gb.user.onlogout=()=>{generation++;result.textContent='Sesión cerrada. Inicia sesión para comprobar otra cuenta.'};gb.user.onlogin=()=>{generation++;result.textContent='Cuenta cambiada. Pulsa Comprobar mi sesión.'};}
</script></body></html>
